<!doctype html>
<!-- ESTRUCTURA de la app. Piensa en esto como el plano: qué espacios existen. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Esta línea hace que se vea bien en el celular (no en miniatura) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anturia</title>
  <!-- Tipografías de Google: una elegante para títulos y una limpia para texto.
       Se cargan "sin bloquear": la página se muestra de inmediato con la letra del
       sistema y las tipografías se aplican cuando llegan (media="print" + onload). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- Conectamos el archivo de estilos (los acabados) -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ===== BARRA SUPERIOR: el nombre de la página, como el letrero de una fachada ===== -->
  <header class="barra-superior">Anturia</header>

  <!-- ===== PANTALLA 1: INICIO ===== -->
  <main id="pantalla-inicio" class="pantalla">
    <div class="decoracion" aria-hidden="true">🌸</div>

    <h1 class="logo">Pétalo</h1>
    <p class="lema">Fotografía una flor y descubre su nombre, su significado y cómo cuidarla.</p>

    <!-- El botón de la cámara.
         Truco: es un <label> que "envuelve" un campo de archivo invisible.
         capture="environment" le pide al celular la cámara TRASERA. -->
    <label class="boton-camara">
      <span class="icono" aria-hidden="true">📷</span>
      <span>Flor</span>
      <input id="entrada-camara" type="file" accept="image/*" capture="environment" hidden>
    </label>

    <!-- El botón de la galería: igual al de la cámara, pero SIN "capture",
         así el celular deja elegir una foto ya guardada (o recibida por WhatsApp). -->
    <label class="boton-galeria">
      <span class="icono" aria-hidden="true">🖼️</span>
      <span>Galería</span>
      <input id="entrada-galeria" type="file" accept="image/*" hidden>
    </label>

    <!-- Accesos: el herbario y el asistente de ramos -->
    <nav class="proximamente">
      <button id="boton-herbario" class="tarjeta-futura activa"><span>📖</span>Herbario<small id="contador-herbario">Sin flores aún</small></button>
      <button id="boton-ramos" class="tarjeta-futura activa"><span>💐</span>Ramos<small>Diseña un ramo</small></button>
    </nav>
  </main>

  <!-- ===== PANTALLA 2: FICHA DE LA FLOR (empieza oculta) ===== -->
  <section id="pantalla-ficha" class="pantalla" hidden>
    <button id="boton-volver" class="boton-volver">← Volver</button>

    <!-- Aquí se muestra la foto que tomó ella -->
    <div class="foto-marco">
      <img id="foto-flor" alt="Foto de la flor">
    </div>

    <!-- JavaScript llena este espacio con los datos de la flor -->
    <article id="ficha" class="ficha"></article>

    <!-- Debajo de la ficha: aviso de "guardada" o botón para eliminar -->
    <div id="acciones-ficha" class="acciones-ficha"></div>
  </section>

  <!-- ===== PANTALLA 3: HERBARIO (empieza oculta) ===== -->
  <section id="pantalla-herbario" class="pantalla" hidden>
    <button id="boton-volver-herbario" class="boton-volver">← Inicio</button>
    <h2 class="titulo-pantalla">Mi herbario</h2>
    <p id="resumen-herbario" class="lema"></p>

    <!-- Estado de la nube: pedir la clave o mostrar que está sincronizado -->
    <div id="caja-nube" class="caja-nube"></div>

    <!-- Si no hay flores, mostramos este mensaje -->
    <div id="herbario-vacio" class="vacio" hidden>
      <div class="decoracion" aria-hidden="true">🌱</div>
      <p>Aún no hay flores. Toca <strong>📷 Flor</strong> en el inicio y cada flor que reconozcas se guardará aquí.</p>
    </div>

    <!-- JavaScript llena esta cuadrícula con una tarjeta por flor -->
    <div id="lista-herbario" class="cuadricula"></div>
  </section>

  <!-- ===== PANTALLA 4: ASISTENTE DE RAMOS (empieza oculta) ===== -->
  <section id="pantalla-ramos" class="pantalla" hidden>
    <button id="boton-volver-ramos" class="boton-volver">← Inicio</button>
    <h2 class="titulo-pantalla">Asistente de ramos</h2>
    <p class="lema">Cuéntame para qué es y te propongo un diseño.</p>

    <!-- El formulario: cada "fieldset" es una pregunta -->
    <form id="form-ramo" class="form-ramo">
      <fieldset>
        <legend>Ocasión</legend>
        <div class="opciones">
          <label><input type="radio" name="ocasion" value="boda" checked><span>💍 Boda</span></label>
          <label><input type="radio" name="ocasion" value="cumpleaños"><span>🎂 Cumpleaños</span></label>
          <label><input type="radio" name="ocasion" value="aniversario"><span>💞 Aniversario</span></label>
          <label><input type="radio" name="ocasion" value="romántico"><span>🌹 Romántico</span></label>
          <label><input type="radio" name="ocasion" value="graduación"><span>🎓 Graduación</span></label>
          <label><input type="radio" name="ocasion" value="condolencias"><span>🕊️ Condolencias</span></label>
          <label><input type="radio" name="ocasion" value="otra"><span>✨ Otra</span></label>
        </div>
      </fieldset>

      <label class="campo">
        <span>Colores o estilo</span>
        <input id="ramo-estilo" name="estilo" type="text" maxlength="200" placeholder="Ej. pastel, romántico, campestre">
      </label>

      <fieldset>
        <legend>Tamaño</legend>
        <div class="opciones">
          <label><input type="radio" name="tamano" value="pequeño"><span>Pequeño</span></label>
          <label><input type="radio" name="tamano" value="mediano" checked><span>Mediano</span></label>
          <label><input type="radio" name="tamano" value="grande"><span>Grande</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Presupuesto</legend>
        <div class="opciones">
          <label><input type="radio" name="presupuesto" value="bajo"><span>$ Bajo</span></label>
          <label><input type="radio" name="presupuesto" value="medio" checked><span>$$ Medio</span></label>
          <label><input type="radio" name="presupuesto" value="alto"><span>$$$ Alto</span></label>
        </div>
      </fieldset>

      <label class="campo">
        <span>Notas (opcional)</span>
        <textarea id="ramo-notas" name="notas" maxlength="500" rows="2" placeholder="Ej. a la novia le encantan las peonías"></textarea>
      </label>

      <label class="casilla">
        <input id="ramo-herbario" name="usarHerbario" type="checkbox" checked>
        <span>📖 Usar flores de mi herbario cuando combinen</span>
      </label>

      <button type="submit" class="boton-disenar">💐 Diseñar ramo</button>
    </form>

    <!-- Aquí aparece el ramo que diseña Claude -->
    <div id="resultado-ramo" class="resultado-ramo"></div>
  </section>

  <!-- Conectamos la "instalación eléctrica" al final, cuando todo ya existe -->
  <script src="app.js"></script>
</body>
</html>
