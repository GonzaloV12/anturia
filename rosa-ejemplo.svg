<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Ilustración de ejemplo: una rosa vectorial (como un dibujo de CAD) -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fbe9ea"/>
      <stop offset="1" stop-color="#f1d3d6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fondo)"/>
  <!-- tallo y hojas -->
  <path d="M200 175 C 198 220, 205 260, 200 300" stroke="#6f8f6b" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M201 235 C 230 215, 262 220, 275 232 C 250 250, 222 250, 201 235 Z" fill="#7f9f7a"/>
  <path d="M200 260 C 172 240, 140 245, 128 258 C 152 275, 180 274, 200 260 Z" fill="#6f8f6b"/>
  <!-- pétalos exteriores -->
  <ellipse cx="160" cy="130" rx="52" ry="44" fill="#c95a69"/>
  <ellipse cx="240" cy="130" rx="52" ry="44" fill="#c95a69"/>
  <ellipse cx="200" cy="165" rx="62" ry="40" fill="#d1626f"/>
  <!-- pétalos medios -->
  <ellipse cx="200" cy="110" rx="58" ry="48" fill="#d9727f"/>
  <ellipse cx="178" cy="132" rx="36" ry="34" fill="#e0848f"/>
  <ellipse cx="222" cy="132" rx="36" ry="34" fill="#e0848f"/>
  <!-- espiral del centro -->
  <path d="M200 120 C 182 120, 180 98, 198 94 C 218 90, 228 112, 212 126 C 196 140, 168 128, 172 104"
        stroke="#b84d5d" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
